name: DJ Sona - Quality and Visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/modernizacao-dj-sona-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: |
          npm run lint
          npm run test
          npm run build
      - name: Validate Pages base path
        run: |
          test -f dist/index.html
          grep -q '/dj-sona/' dist/index.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture pages and verify browser interactions
        run: node tests/visual-qa.cjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj-sona-visual-qa
          path: visual-qa/
          retention-days: 14
