name: DJ Sona - Quality and Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dj-sona-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Static source checks
        run: npm run lint && npm run test
      # QA visual usa as mídias locais; FFmpeg e media:check são validados no deploy de Pages.
      - name: Build UI for browser tests
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/dj-sona-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/dj-sona/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dj-sona-preview.log
          exit 1
      - name: Playwright screenshots and UI regression checks
        run: node scripts/visual-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj-sona-visual-qa
          path: qa-screenshots/
          retention-days: 14
          if-no-files-found: ignore
