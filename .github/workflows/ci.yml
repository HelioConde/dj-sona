name: Quality and visual QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/modernizacao-dj-sona-pages]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: ESLint and tests
        run: npm run lint && npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright CLI and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/dj-sona-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/dj-sona/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dj-sona-preview.log
          exit 1
      - name: Playwright responsive screenshots and interaction checks
        run: node scripts/visual-qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj-sona-visual-qa
          path: qa-screenshots/
          if-no-files-found: ignore
