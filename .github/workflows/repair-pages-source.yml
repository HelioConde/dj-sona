name: Repair Pages source (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-pages-source.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Switch from Jekyll branch publishing to Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          configured="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          echo "Pages build type: $configured"
          test "$configured" = "workflow"
