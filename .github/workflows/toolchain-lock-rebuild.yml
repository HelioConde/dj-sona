name: DJ Sona - Patch last transitive dependency
on:
  push:
    branches: [fix/modern-toolchain-vite7-eslint9-20261027]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/toolchain-lock-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dj-sona-modern-toolchain-lock
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile without bypassing peer checks
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check patched dependency and full npm audit
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            const patched=lock.packages["node_modules/brace-expansion"]?.version;
            if (patched !== "1.1.21") throw Error("brace-expansion not pinned: " + patched);
            console.log("Patched brace-expansion@" + patched);
          '
          npm audit --audit-level=low
      - name: Commit audited lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(lockfile): resolve brace-expansion 1.1.21"
            git push origin HEAD:fix/modern-toolchain-vite7-eslint9-20261027
          fi
