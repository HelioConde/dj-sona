name: DJ Sona - Refresh ESLint React peer-dependency lockfile
on:
  push:
    branches: [fix/modern-toolchain-vite7-eslint9-20261027]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/toolchain-lock-rebuild.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: dj-sona-modern-toolchain-lock
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve modern dependencies and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation with peer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile verified by npm ci
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged."
          else
            git commit -m "chore(lockfile): align React ESLint plugin with ESLint 9"
            git push origin HEAD:fix/modern-toolchain-vite7-eslint9-20261027
          fi
      - name: Verify ESLint and Node tests
        run: npm run lint && npm run test
