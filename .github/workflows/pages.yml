name: Build and publish DJ Sona (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg
        timeout-minutes: 6
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Quality checks
        run: npm run lint && npm run test
      - name: Build optimized static site
        run: npm run build:pages
      - name: Verify compiled Vite entry, not development HTML
        run: |
          npm run media:check
          test -f dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          ! grep -q '%BASE_URL%' dist/index.html
          grep -E '/dj-sona/assets/[^"]+\\.js' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          du -sh dist
      - uses: actions/configure-pages@v5
      - name: Set Pages publication source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A branch-based Pages build publishes index.html source, breaking JSX and %BASE_URL%.
          # Pages REST API requires Pages write permission, already granted above.
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --jq '.build_type'; then
            echo "GitHub Pages configured to deploy Actions artifacts."
          else
            echo "::warning::Could not switch Pages source automatically. Open Settings > Pages > Build and deployment > Source > GitHub Actions."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live HTML does not expose Vite source paths
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --location --max-time 15 --header 'Cache-Control: no-cache' "https://helioconde.github.io/dj-sona/?deploy=${GITHUB_SHA}" -o /tmp/dj-sona-live.html &&
               ! grep -q '/src/main.jsx' /tmp/dj-sona-live.html &&
               ! grep -q '%BASE_URL%' /tmp/dj-sona-live.html &&
               grep -q '/dj-sona/assets/' /tmp/dj-sona-live.html; then
              echo "Live GitHub Pages is serving the compiled Vite HTML."
              exit 0
            fi
            echo "Site not updated yet (attempt ${attempt}/10)."
            sleep 12
          done
          echo "::error::Live Pages still serves uncompiled HTML. Go to Settings > Pages > Build and deployment > Source and select GitHub Actions."
          exit 1
