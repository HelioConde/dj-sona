name: Build and publish DJ Sona (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare cached FFmpeg/FFprobe binaries
        uses: FedericoCarboni/setup-ffmpeg@v3.1
        timeout-minutes: 7
        continue-on-error: true
        with:
          ffmpeg-version: release
      - name: Verify FFmpeg/FFprobe or install fallback
        timeout-minutes: 18
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg e FFprobe já disponíveis; sem apt-get."
          else
            echo "Binaries indisponíveis; instalação mínima como fallback."
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Quality checks
        run: npm run lint && npm run test
      - name: Build optimized static site
        run: npm run build:pages
      - name: Verify compiled Vite entry, not development HTML
        run: |
          npm run media:check
          test -f dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          ! grep -q '%BASE_URL%' dist/index.html
          grep -q '/dj-sona/assets/' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          du -sh dist
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live HTML does not expose Vite source paths
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --location --max-time 15 --header 'Cache-Control: no-cache' "https://helioconde.github.io/dj-sona/?deploy=${GITHUB_SHA}" -o /tmp/dj-sona-live.html &&
               ! grep -q '/src/main.jsx' /tmp/dj-sona-live.html &&
               ! grep -q '%BASE_URL%' /tmp/dj-sona-live.html &&
               grep -q '/dj-sona/assets/' /tmp/dj-sona-live.html; then
              echo "Live GitHub Pages is serving the compiled Vite HTML."
              exit 0
            fi
            echo "Site not updated yet (attempt ${attempt}/10)."
            sleep 12
          done
          echo "::error::Live Pages still serves uncompiled HTML. Go to Settings > Pages > Build and deployment > Source and select GitHub Actions."
          exit 1
