name: Build and publish DJ Sona (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare FFmpeg / FFprobe without apt downloads
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Using tools already available on GitHub runner."
          else
            # The apt mirrors can stall for minutes. Download pinned static tools instead.
            npm install --no-save --package-lock=false ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
            mkdir -p "$RUNNER_TEMP/dj-sona-media-bin"
            ln -s "$(node -p 'require("ffmpeg-static")')" "$RUNNER_TEMP/dj-sona-media-bin/ffmpeg"
            ln -s "$(node -p 'require("@ffprobe-installer/ffprobe").path')" "$RUNNER_TEMP/dj-sona-media-bin/ffprobe"
            echo "$RUNNER_TEMP/dj-sona-media-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/dj-sona-media-bin:$PATH"
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264' || { echo '::error::FFmpeg must have libx264 support'; exit 1; }
      - name: Quality checks
        run: npm run lint && npm run test
      - name: Build optimized static site
        run: npm run build:pages
      - name: Verify compiled Vite entry, not development HTML
        run: |
          npm run media:check
          test -f dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          ! grep -q '%BASE_URL%' dist/index.html
          grep -q '/dj-sona/assets/' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          du -sh dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live HTML does not expose Vite source paths
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --location --max-time 15 --header 'Cache-Control: no-cache' "https://helioconde.github.io/dj-sona/?deploy=${GITHUB_SHA}" -o /tmp/dj-sona-live.html &&
               ! grep -q '/src/main.jsx' /tmp/dj-sona-live.html &&
               ! grep -q '%BASE_URL%' /tmp/dj-sona-live.html &&
               grep -q '/dj-sona/assets/' /tmp/dj-sona-live.html; then
              echo "Live GitHub Pages is serving the compiled Vite HTML."
              exit 0
            fi
            echo "Site not updated yet (attempt ${attempt}/10)."
            sleep 12
          done
          echo "::error::Live Pages still serves uncompiled HTML. Go to Settings > Pages > Build and deployment > Source and select GitHub Actions."
          exit 1
