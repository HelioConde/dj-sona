name: DJ Sona - Refresh security router lockfile
on:
  push:
    branches: [fix/dj-sona-router-7-18-4-20261027]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/router-lock-rebuild.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dj-sona-router-lock
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild lockfile with npm, without installing build tools
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check router version and production audit
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            const version=lock.packages?.["node_modules/react-router-dom"]?.version || "";
            console.log("react-router-dom:",version);
            const [major, minor, patch] = version.split(".").map(Number);
            if (major !== 7 || minor < 18 || (minor === 18 && patch < 4) || !Number.isInteger(patch)) process.exit(1);
          '
          npm audit --omit=dev --json > /tmp/dj-sona-router-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit=JSON.parse(fs.readFileSync("/tmp/dj-sona-router-audit.json","utf8"));
            const vuln=audit.metadata?.vulnerabilities;
            if (!vuln) throw Error("Invalid npm audit response");
            console.log("Production vulnerabilities:",JSON.stringify(vuln));
            if ((vuln.high||0)+(vuln.critical||0)>0) process.exit(1);
          '
      - name: Commit regenerated package-lock.json to remediation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already updated." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore(lockfile): resolve secure React Router 7 packages"
            git push origin HEAD:fix/dj-sona-router-7-18-4-20261027
            echo "Secure router lockfile regenerated and pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
